[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coherent"
version = "0.1.0"
description = "Spec-driven governance and orchestration harness for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.11",
    "langchain-core>=1.6.0",
    "langchain-anthropic>=1.6.1",
    "langchain-openai>=1.6.0",
    "langchain-google-genai>=4.3.5",
    "langchain-groq>=1.1.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "networkx>=3.6.1",
    "aiosqlite>=0.22.1",
    "typer>=0.27.1",
    "rich>=15.0.0",
    "inquirerpy>=0.3.4",
    "langgraph-checkpoint-sqlite>=3.1.1"
    "pydantic_settings"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
coherent = "coherent.cli.main:app"